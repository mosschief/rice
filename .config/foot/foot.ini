# Hand-owned foot config. Everything here survives a day/night toggle.
#
# The [colors] block is NOT in this file: it is generated state that flips with
# the theme, so it lives in colors.ini, which the theme scripts overwrite by
# copying colors-day.ini or colors-night.ini over it — the same variant + active
# copy pattern waybar and GTK use in this repo.
#
# This split exists because the theme scripts used to rewrite the whole of
# foot.ini from a heredoc that hardcoded font=Iosevka Oui:size=9, so every
# toggle silently reverted the font size set in 75b1459.
#
# foot resolves include relative to nothing — the path must be absolute or start
# with ~/ — and the included file has its own section scope.

[main]
font=Iosevka Oui:size=10

include=~/.config/foot/colors.ini
