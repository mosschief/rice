# hyprlock — the lock screen, shared by the Hyprland and Sway sessions.
#
# Replaces swaylock. swaylock cannot do either of the two things this lock is
# meant to do: its indicator is a hard-coded ring with no rectangular mode, and
# it has no fade at all (the --fade-in flag is from the swaylock-effects fork,
# not upstream). hyprlock has both natively — animations:fadeIn / fadeOut, and
# an input-field whose `rounding` turns it into a rectangle.
#
# hyprlock speaks plain ext-session-lock-v1 and needs no Hyprland IPC, so the
# same config drives the Sway session too.
#
# Palette: black background, with the rice's three colours on top of it. The
# night-mode values are used regardless of whether the desktop is in day or
# night mode — the lock screen fades to black either way, so the dark palette
# is the only one that reads correctly on it. That also means the day/night
# toggle scripts have nothing to rewrite here.
#
#   #000000  lock background
#   #1c1b16  input field fill      (night background)
#   #deddd1  input field outline   (accent)
#   #f2f1e5  text, dots            (night foreground)
#
# Comments must use '#'. hyprlang has no '//' comment form — a '//' line is
# parsed as config and fails.

general {
    # The pointer would otherwise sit on the black screen as the one thing
    # still visible after the fade.
    hide_cursor = true
    # Enter on an empty field is a no-op instead of a failed attempt, so it
    # does not count against pam_faillock.
    ignore_empty_input = true
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    # No pam:module set, so hyprlock looks for /etc/pam.d/hyprlock and falls
    # back to the "su" stack when it is absent. Distro packages install that
    # file; a from-source build into a user prefix does not, and installing it
    # needs root — see the README.
    fingerprint:enabled = false
}

animations {
    enabled = true
    # Same curve as the window animations in hyprland.conf.
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    # Units are 100ms, so 6 = 600ms. Slower than the 200ms window animations
    # on purpose: this one is the desktop dissolving to black, not a window
    # popping in. fadeOut runs on unlock, fading the session back in.
    animation = fadeIn,  1, 6, ease
    animation = fadeOut, 1, 6, ease
    # Dots appear and clear with the same easing rather than snapping.
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    # No path, so `color` is used. Black, not the theme background: the point
    # is that the screen goes dark.
    color = rgb(000000)
    blur_passes = 0
}

input-field {
    monitor =
    size = 400, 44
    # rounding 6 and outline 2 are the window values from hyprland.conf
    # (decoration:rounding, general:border_size), so the field is recognisably
    # the same object as a window border. -1 here would give the oval that the
    # default config uses.
    rounding = 6
    outline_thickness = 2

    inner_color = rgb(1c1b16)
    outer_color = rgb(deddd1)
    font_color  = rgb(f2f1e5)
    font_family = Iosevka Oui

    # Left-aligned dots that grow rightwards, i.e. a text field filling up,
    # rather than a centred cluster.
    dots_center   = false
    dots_size     = 0.2
    dots_spacing  = 0.35
    dots_rounding = -1
    # false: true is swaylock's indicator, which is what we are replacing.
    hide_input = false

    # The field stays put instead of dissolving after two idle seconds — a
    # visible box is the whole point.
    fade_on_empty = false
    placeholder_text = <i>password</i>

    # Monochrome feedback. The rice has no red or green, so instead of a
    # colour change the field inverts: swap_font_color exchanges the fill and
    # text colours while checking and on failure, the same light-on-dark /
    # dark-on-light inversion the day/night toggle uses.
    swap_font_color = true
    check_color = rgb(2e2d26)
    fail_color  = rgb(f2f1e5)
    check_text  = <i>checking</i>
    fail_text   = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, 0
    halign = center
    valign = center
}
