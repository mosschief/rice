# hyprlock — the lock screen, shared by the Hyprland and Sway sessions.
#
# Replaces swaylock. swaylock cannot do either of the two things this lock is
# meant to do: its indicator is a hard-coded ring with no rectangular mode, and
# it has no fade at all (the --fade-in flag is from the swaylock-effects fork,
# not upstream). hyprlock has both natively — animations:fadeIn / fadeOut, and
# an input-field whose `rounding` turns it into a rectangle.
#
# hyprlock speaks plain ext-session-lock-v1 and needs no Hyprland IPC, so the
# same config drives the Sway session too.
#
# Palette: black background, with the rice's three colours on top of it. The
# night-mode values are used regardless of whether the desktop is in day or
# night mode — the lock screen fades to black either way, so the dark palette
# is the only one that reads correctly on it. That also means the day/night
# toggle scripts have nothing to rewrite here.
#
#   #000000  lock background, and the input field's fill
#   #deddd1  input field outline   (accent)
#   #f2f1e5  text, asterisks       (night foreground)
#
# Comments must use '#'. hyprlang has no '//' comment form — a '//' line is
# parsed as config and fails.

general {
    # The pointer would otherwise sit on the black screen as the one thing
    # still visible after the fade.
    hide_cursor = true
    # Enter on an empty field is a no-op instead of a failed attempt, so it
    # does not count against pam_faillock.
    ignore_empty_input = true
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    # No pam:module set, so hyprlock looks for /etc/pam.d/hyprlock and falls
    # back to the "su" stack when it is absent. Distro packages install that
    # file; a from-source build into a user prefix does not, and installing it
    # needs root — see the README.
    fingerprint:enabled = false
}

animations {
    enabled = true
    # Same curve as the window animations in hyprland.conf.
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    # Units are 100ms, so 6 = 600ms. Slower than the 200ms window animations
    # on purpose: this one is the desktop dissolving to black, not a window
    # popping in. fadeOut runs on unlock, fading the session back in.
    animation = fadeIn,  1, 6, ease
    animation = fadeOut, 1, 6, ease
    # Asterisks appear and clear with the same easing rather than snapping.
    animation = inputFieldDots, 1, 2, ease
    # The field's own show/hide, driven by fade_on_empty. 200ms so it arrives
    # promptly under the first keystroke instead of easing in behind it.
    animation = inputFieldFade, 1, 2, ease
}

background {
    monitor =
    # No path, so `color` is used. Black, not the theme background: the point
    # is that the screen goes dark.
    color = rgb(000000)
    blur_passes = 0
}

input-field {
    monitor =
    size = 400, 44
    # rounding 6 and outline 2 are the window values from hyprland.conf
    # (decoration:rounding, general:border_size), so the field is recognisably
    # the same object as a window border. -1 here would give the oval that the
    # default config uses.
    rounding = 6
    outline_thickness = 2

    # Same black as the background: the field is an outline only, with nothing
    # filling it. Anything lighter reads as a panel floating on the black.
    inner_color = rgb(000000)
    outer_color = rgb(deddd1)
    font_color  = rgb(f2f1e5)
    font_family = Iosevka Oui

    # Asterisks instead of the default rounded rectangles. Two things follow
    # from switching to a text indicator:
    #   - dots_size becomes a font size (size.y * dots_size, rounded to even),
    #     so the 0.2 that suited drawn dots would render an 8px glyph. 0.5 gives
    #     22px in this 44px field.
    #   - dots_rounding must be 0. With a text format the glyph is drawn as a
    #     texture and the rounding is applied to it, so -1 would clip each
    #     asterisk into a circle.
    dots_text_format = *
    dots_size     = 0.5
    dots_spacing  = 0.1
    dots_rounding = 0
    # Centred, so the run of asterisks grows outwards from the middle of the
    # field and stays balanced in it at any length.
    dots_center = true
    # false: true is swaylock's indicator, which is what we are replacing.
    hide_input = false

    # No placeholder. check_text and fail_text still use this slot, so
    # feedback is unaffected.
    placeholder_text =

    # Hidden until you type. fade.a is created with an initial value of 0, so
    # with fade_on_empty the field starts invisible rather than appearing and
    # then fading out — there is no flash of the box when the lock comes up.
    # The first keypress makes passwordLength non-zero and fades it in; it fades
    # back out once the buffer is empty again.
    #
    # fade_timeout must stay non-zero. At 0 the field hides the instant the
    # buffer empties, and a rejected password clears the buffer — the fail text
    # is drawn with this same alpha, so it would disappear before it could be
    # read. 2000ms leaves it on screen about as long as fail_timeout.
    fade_on_empty = true
    fade_timeout = 2000

    # Monochrome feedback, carried entirely by the outline: it dims while the
    # password is being checked and brightens when it is rejected. The rice has
    # no red or green to spend on this.
    #
    # swap_font_color is deliberately off. It exchanges the fill and text
    # colours on every check, which with a black fill means flashing the whole
    # box to #f2f1e5 each time you press Enter.
    swap_font_color = false
    check_color = rgb(2e2d26)
    fail_color  = rgb(f2f1e5)
    check_text  = <i>checking</i>
    fail_text   = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, 0
    halign = center
    valign = center
}
