# FALLBACK ONLY: for the Hyprland 0.52 build in ~/.local/hypr, selected with
#   echo ~/.local/hypr > ~/.config/hypr/session-prefix
# The normal session is Hyprland 0.56, which reads hyprland.lua + config/*.lua
# (shared with the CachyOS machine) and ignores this file. 0.52 predates the Lua
# config, so this is a hyprlang translation of that config as of the switch; it
# is not kept in sync. Day/night only reaches Noctalia here: borders stay on
# the day palette.

#############
# Variables #
#############

$mod   = ALT
$up    = L
$down  = K
$left  = J
$right = semicolon

# Upstream kitty build in ~/.local/kitty.app (noble's 0.32 has no cursor_trail)
$terminal    = ~/.local/bin/kitty
$fileManager = nautilus
$browser     = firefox
$noct        = noctalia msg
$hypr        = ~/.config/hypr

############
# Monitors #
############
# Kept from this laptop's existing config (HP EliteBook 8 G1i, 1920x1200 panel
# at scale 1), not the Framework layout in cachyos/config/monitors.lua.
# Externals are matched by desc: (model + serial) because MST daisy-chaining at
# home and evdi (DisplayLink) at work both renumber connectors across replugs.
#   eDP-1           0 -> 1920   (1920x1200 @ 1)
#   middle monitor  1920 -> 4480 (2560x1440)
#   right monitor   4480 -> 7040 (2560x1440)

# Home: ASUS PA278CV -> PA278CGV (daisy-chained)
monitor = desc:ASUSTek COMPUTER INC PA278CV W3LMQV029417, 2560x1440@74.92, 1920x0, 1
monitor = desc:ASUSTek COMPUTER INC PA278CGV TCLMQV045359, preferred, 4480x0, 1
# Work: HP USB-C/A Universal Dock G2. Its DP outputs are DisplayLink (evdi), so
# if they are dark check `lsmod | grep evdi` before touching these lines.
monitor = desc:Dell Inc. DELL P2725DE D1X9K84, preferred, 1920x0, 1
monitor = desc:Dell Inc. DELL P2725DE 4L68074, preferred, 4480x0, 1

monitor = eDP-1, preferred, 0x0, 1
# Anything else: to the right, native scale
monitor = , preferred, auto, 1

###############
# Look & feel #
###############
# cachyos/config/decorations.lua + misc.lua

general {
    gaps_in  = 4          # rice: 8px between windows
    gaps_out = 8
    border_size = 2
    layout = dwindle
    extend_border_grab_area = 10
    resize_on_border = true
    # Border colours come from the day/night file sourced at the bottom.
}

decoration {
    rounding = 0
    dim_special = 0.3
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# cachyos/config/animations.lua. 0.52 has no spring curves, so CachyOS's
# `easy` spring (mass 1, stiffness 500, dampening 35) is replaced by a bezier
# fitted to its step response: that spring is slightly underdamped (zeta 0.78),
# peaks at 1.9% overshoot and settles in 0.45s (hyprutils' 0.001 epsilons), so
# the curve overshoots to match and runs for speed 4.5 (= 450ms). Fit error is
# 1.5% RMS over the whole run. Springs ignore `speed`; beziers need it.
animations {
    enabled = true
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = ease,           0.25, 0.1,  0.25, 1.0   # rice
    bezier = overshoot,      0.5,  0.9,  0.1,  1.1
    bezier = easy,           0.359, 0.981, 0.047, 1.066   # ≈ spring easy
    animation = global,              1, 3,   quick
    animation = windows,             1, 4.5, easy, slide
    animation = workspaces,          1, 1,   ease, fade           # rice: quick fade
    animation = specialWorkspaceIn,  1, 2,   quick, slide top
    animation = specialWorkspaceOut, 1, 2,   quick, slide bottom
}

dwindle {
    preserve_split = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    # rice: plain solid background, no logo/splash. Noctalia draws the
    # wallpaper layer on top, so background_color only shows before it starts.
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # let a fresh lock client take over if the lock screen crashes
    allow_session_lock_restore = true
    middle_click_paste = false
    enable_swallow = true
    swallow_regex = ^(kitty|foot|footclient)$
}

render {
    direct_scanout = 2
}

xwayland {
    force_zero_scaling = true
}

#########
# Input #
#########
# cachyos/config/inputs.lua. no_hardware_cursors was a Panther Lake workaround
# and is left off here.

input {
    accel_profile = flat
    follow_mouse = 0      # rice: focus does not follow the mouse
    touchpad {
        tap-to-click = true
        natural_scroll = false
        disable_while_typing = true
    }
}

gesture = 4, horizontal, workspace
gesture = 3, down, close
gesture = 3, up, fullscreen
gesture = 3, left, float

################
# Window rules #
################
# cachyos/config/windowrules.lua, 0.52 syntax.

windowrule = persistentsize, floating:1

# Picture-in-Picture
windowrule = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = keepaspectratio, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = size 25% 25%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Apps
windowrule = float, class:^(.*[Ll]auncher.*)$
windowrule = float, class:^(.*[Cc]alc.*)$
windowrule = float, class:^(dev\.)?(noctalia\.Noctalia(\.Settings)?)$
windowrule = size 70% 70%, class:^(dev\.)?(noctalia\.Noctalia(\.Settings)?)$

# Opacity overrides (rice has no transparency; terminals set their own alpha)
windowrule = opacity 1.0 override, class:^(firefox|kitty|foot|footclient|mpv|.*vlc.*)$
# Super+F / Alt+F fullscreen Firefox at the Hyprland level only, so it keeps
# its tabs and toolbar instead of entering its own kiosk-style fullscreen.
windowrule = syncfullscreen 0, class:^(firefox)$

# Float utility windows
windowrule = float, class:^(org.pulseaudio.pavucontrol|blueman-manager|nm-applet|nm-connection-editor|nwg-look)$

# Float common modals
windowrule = float, title:^(Open|Authentication Required|Add Folder to Workspace|Choose Files|Save As|Confirm to replace files|File Operation Progress)$
windowrule = float, initialTitle:^(Open File)$
windowrule = float, class:^([Xx]dg-desktop-portal-gtk)$
windowrule = float, title:^(File Upload|Choose wallpaper|Library)(.*)$
windowrule = float, class:^(.*dialog.*)$
windowrule = float, title:^(.*dialog.*)$

# Ignore maximize requests from all apps
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Noctalia surfaces animate themselves
layerrule = noanim, ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$

#############################
# Rice key binds (ALT)      #
#############################
# cachyos/config/rice_binds.lua

# Theme
bind = $mod, F5, exec, $hypr/theme.sh night
bind = $mod, F6, exec, $hypr/theme.sh day

# Apps
bind = $mod, Return, exec, $terminal
bind = $mod, C, exec, $browser
bind = $mod, O, exec, obsidian
bind = $mod, D, exec, $noct panel-toggle launcher

# Kill focused window
bind = $mod SHIFT, Q, killactive

# Focus
bind = $mod, $left,  movefocus, l
bind = $mod, $down,  movefocus, d
bind = $mod, $up,    movefocus, u
bind = $mod, $right, movefocus, r
bind = $mod, Left,   movefocus, l
bind = $mod, Down,   movefocus, d
bind = $mod, Up,     movefocus, u
bind = $mod, Right,  movefocus, r

# Move
bind = $mod SHIFT, $left,  movewindow, l
bind = $mod SHIFT, $down,  movewindow, d
bind = $mod SHIFT, $up,    movewindow, u
bind = $mod SHIFT, $right, movewindow, r
bind = $mod SHIFT, Left,   movewindow, l
bind = $mod SHIFT, Down,   movewindow, d
bind = $mod SHIFT, Up,     movewindow, u
bind = $mod SHIFT, Right,  movewindow, r

# Split / layout (dwindle auto-splits; these flip the split orientation)
bind = $mod, H, layoutmsg, togglesplit
bind = $mod, V, layoutmsg, togglesplit
bind = $mod, E, layoutmsg, togglesplit
# sway tabbed/stacking ≈ window groups
bind = $mod, W, togglegroup
bind = $mod, S, togglegroup
bind = $mod, Tab, changegroupactive, f

# Fullscreen / floating
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, space, togglefloating

# Scratchpad -> special workspace
bind = $mod SHIFT, minus, movetoworkspace, special
bind = $mod, minus, togglespecialworkspace

# Workspaces 1-10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Session
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exit
bind = CTRL $mod, L, exec, $hypr/lock.sh

# Drag / resize windows with the modifier held
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize mode (ALT+R, then J K L ; / arrows; Return or Escape to leave)
bind = $mod, R, submap, resize
submap = resize
binde = , $left,  resizeactive, -10 0
binde = , $down,  resizeactive, 0 10
binde = , $up,    resizeactive, 0 -10
binde = , $right, resizeactive, 10 0
binde = , Left,   resizeactive, -10 0
binde = , Down,   resizeactive, 0 10
binde = , Up,     resizeactive, 0 -10
binde = , Right,  resizeactive, 10 0
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
submap = reset

# Lid close is left to systemd-logind (HandleLidSwitch=suspend,
# HandleLidSwitchDocked=ignore). Noctalia takes the session lock before sleep
# through a logind inhibitor, so binding the switch here would race it.

#############################
# CachyOS key binds (SUPER) #
#############################
# cachyos/config/binds.lua. The per-monitor SUPER+1..3 binds are left out:
# the monitor set differs between home and work.

# Window manipulation
bind = SUPER, Escape, exec, hyprctl kill
bind = SUPER, Q, killactive
bind = SUPER ALT, space, togglefloating
bind = SUPER, D, fullscreen, 1
bind = SUPER, F, fullscreen, 0
bind = SUPER, J, layoutmsg, togglesplit

# Focus
bind = SUPER, Left,  movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up,    movefocus, u
bind = SUPER, Down,  movefocus, d
bind = SUPER, Tab, exec, $noct window-switcher

# Move windows between directions, monitors and workspaces
bind = SUPER SHIFT, Up,    movewindow, u
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Left,  movewindow, l
bind = SUPER SHIFT, Down,  movewindow, d
bind = SUPER SHIFT, mouse_up,   movewindow, mon:-1
bind = SUPER SHIFT, mouse_down, movewindow, mon:+1
bind = SUPER CTRL SHIFT, Right,      movetoworkspace, m+1
bind = SUPER CTRL SHIFT, Left,       movetoworkspace, m-1
bind = SUPER CTRL SHIFT, mouse_up,   movetoworkspace, m-1
bind = SUPER CTRL SHIFT, mouse_down, movetoworkspace, m+1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Zoom (clamped to 1.0-3.0, as the Lua helper did)
binde = SUPER, minus, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '[[.float - 0.3, 1.0] | max, 3.0] | min')"
binde = SUPER, plus,  exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '[[.float + 0.3, 1.0] | max, 3.0] | min')"
binde = SUPER, KP_Subtract, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '[[.float - 0.3, 1.0] | max, 3.0] | min')"
binde = SUPER, KP_Add,      exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '[[.float + 0.3, 1.0] | max, 3.0] | min')"

# Launchers and Noctalia panels
bind = SUPER, Return, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, W, exec, $browser
bind = CTRL SHIFT, Escape, exec, $terminal -e btop
bind = SUPER, Z, exec, $noct settings-toggle
bind = SUPER, X, exec, $noct panel-toggle control-center
bind = SUPER, space, exec, $noct panel-toggle launcher
bind = SUPER, period, exec, $noct panel-toggle launcher /emo
bind = SUPER ALT, C, exec, $noct panel-toggle session
bind = SUPER SHIFT, W, exec, $noct panel-toggle wallpaper
bind = SUPER, V, exec, $noct panel-toggle clipboard
bind = SUPER, A, exec, $noct panel-toggle control-center notifications
# Super+L locks as well: this laptop's padlock key emits no evdev keycode (the
# HP embedded controller consumes it), so it cannot be bound directly.
bindl = SUPER, L, exec, $hypr/lock.sh

# Screen capture
bind = , Print, exec, $noct screenshot-region
bind = SUPER, Print, exec, $noct screenshot-fullscreen

# Workspaces
bind = SUPER ALT, 1, workspace, 1
bind = SUPER ALT, 2, workspace, 2
bind = SUPER ALT, 3, workspace, 3
bind = SUPER CTRL, Right, workspace, m+1
bind = SUPER CTRL, Left,  workspace, m-1
bind = SUPER CTRL, Down,  workspace, emptym
bind = SUPER, mouse_down, workspace, m-1
bind = SUPER, mouse_up,   workspace, m+1
bind = SUPER SHIFT, S, movetoworkspace, special
bind = SUPER, S, togglespecialworkspace

# Hardware keys, all through Noctalia so its OSD shows
bindle = , XF86AudioRaiseVolume,  exec, $noct volume-up
bindle = , XF86AudioLowerVolume,  exec, $noct volume-down
bindl  = , XF86AudioMute,         exec, $noct volume-mute
bindl  = , XF86AudioMicMute,      exec, $noct mic-mute
bindl  = , XF86AudioPlay,         exec, $noct media toggle
bindl  = , XF86AudioPause,        exec, $noct media toggle
bindl  = , XF86AudioNext,         exec, $noct media next
bindl  = , XF86AudioPrev,         exec, $noct media previous
bindle = , XF86MonBrightnessUp,   exec, $noct brightness-up
bindle = , XF86MonBrightnessDown, exec, $noct brightness-down
bindle = , XF86KbdBrightnessUp,   exec, $noct keyboard-backlight-up
bindle = , XF86KbdBrightnessDown, exec, $noct keyboard-backlight-down
bindl  = , XF86KbdLightOnOff,     exec, $noct keyboard-backlight-toggle

#############
# Autostart #
#############
# Only these two variables go into the systemd/dbus activation environment.
# `--all` (as on CachyOS) would also push this session's LD_LIBRARY_PATH for
# ~/.local/hypr/lib into the user manager, and from there into every service.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = noctalia
# blueman-applet registers the Bluetooth pairing agent (PIN/confirm dialogs).
exec-once = $hypr/blueman-applet-keepalive.sh

# Day palette borders (config/theme.lua picks these per mode under 0.56)
general {
    col.active_border   = rgb(000000)
    col.inactive_border = rgb(deddd1)
}
misc {
    background_color = rgb(f2f1e5)
}
