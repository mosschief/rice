font_family                 Iosevka Oui
font_size                   10.0
background_opacity          0.95
cursor_trail                1
window_padding_width        0

# Screen-shake when a command fails: bash rings BEL on non-zero exit
# (~/.bashrc) and shaders/shake.pipeline animates on bell-in-window.
# Kitty only fires bell shaders when visual_bell_duration is nonzero, so
# set it too small to show its own flash.
custom_shaders              shake
visual_bell_duration        0.00001
enable_audio_bell           no

include themes/noctalia.conf
